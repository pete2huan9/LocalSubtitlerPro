[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-subtitler-pro"
version = "0.2.0"
description = "High-precision local AI video subtitling, LLM translation and soft-muxing workstation with modern PyQt6 GUI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Peter" }
]
keywords = [
    "subtitle",
    "whisper",
    "faster-whisper",
    "ollama",
    "llm",
    "translation",
    "video-subtitles",
    "pyqt6",
    "ai"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "PyQt6>=6.6.0",
    "faster-whisper>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0"
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10.0"
]

[project.scripts]
subtitler-gui = "gui_app:main"
subtitler-cli = "video_subtitler:main"

[project.urls]
Homepage = "https://github.com/Peter/LocalSubtitlerPro"
Repository = "https://github.com/Peter/LocalSubtitlerPro"
"Bug Tracker" = "https://github.com/Peter/LocalSubtitlerPro/issues"
